name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: devbox run -- bash -e {0}
    env:
      GOOGLE_CLIENT_ID: dummy-client-id-for-ci
      GOOGLE_CLIENT_SECRET: dummy-client-secret-for-ci
      BETTER_AUTH_SECRET: dummy-secret-for-ci-build
      BETTER_AUTH_URL: http://localhost:3000
      OAUTH_PROXY_SECRET: dummy-oauth-proxy-secret-for-ci
      AUTH_PRODUCTION_URL: https://production.example.com
      AUTH_ALLOWED_HOSTS: localhost:3000,production.example.com,preview-*.example.com
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: dummy-google-maps-api-key-for-ci
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7
        with:
          devbox-version: '0.17.2'
          enable-cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git for cocogitto
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$PR_TITLE" | devbox run -- cog verify --file -; then
            echo "::error::PR title does not follow Conventional Commits format. See docs/pr-rules.md for details. Example: feat: add meal search"
            exit 1
          fi

      - name: Verify commit message
        if: github.event_name == 'pull_request'
        env:
          COCOGITTO_INIT_HOOK: '1'
        run: cog check "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Verify
        run: pnpm verify

      - name: Build
        run: pnpm build
